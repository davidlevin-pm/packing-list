<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Rich iOS gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle radial highlight at top-left -->
    <radialGradient id="glow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Suitcase body gradient -->
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Emerald checkmark badge gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Amber luggage tag gradient -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.45" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed background (iOS masks corners automatically) -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)" />
  <rect width="1024" height="1024" rx="224" fill="url(#glow)" />

  <!-- Subtle decorative flight arc in background -->
  <path d="M 140 310 Q 512 110 860 250" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-dasharray="16 18" stroke-linecap="round" opacity="0.4" />

  <!-- Sleek Airplane silhouette top-right -->
  <g transform="translate(835, 238) rotate(22) scale(1.15)" opacity="0.9">
    <path d="M 0 -32 L 10 -8 L 42 4 L 42 12 L 10 8 L 6 28 L 18 36 L 18 42 L 0 37 L -18 42 L -18 36 L -6 28 L -10 8 L -42 12 L -42 4 L -10 -8 Z" fill="#f8fafc" />
  </g>

  <!-- Main Suitcase Assembly -->
  <g filter="url(#shadow)">
    <!-- Telescopic Handle Bars -->
    <rect x="392" y="170" width="26" height="150" rx="8" fill="#94a3b8" />
    <rect x="606" y="170" width="26" height="150" rx="8" fill="#94a3b8" />
    <!-- Telescopic Grip Top -->
    <rect x="372" y="152" width="280" height="38" rx="19" fill="#cbd5e1" />
    <rect x="420" y="160" width="184" height="22" rx="11" fill="#475569" />

    <!-- Top Soft Handle -->
    <path d="M 448 296 C 448 258, 576 258, 576 296" fill="none" stroke="#64748b" stroke-width="22" stroke-linecap="round" />

    <!-- Wheels -->
    <rect x="316" y="810" width="44" height="58" rx="18" fill="#1e293b" />
    <rect x="664" y="810" width="44" height="58" rx="18" fill="#1e293b" />

    <!-- Suitcase Body -->
    <rect x="256" y="286" width="512" height="548" rx="76" fill="url(#caseGrad)" />

    <!-- Corner Bumpers / Metallic Accents -->
    <path d="M 256 362 A 76 76 0 0 1 332 286 L 356 286 L 256 386 Z" fill="#cbd5e1" opacity="0.65" />
    <path d="M 768 362 A 76 76 0 0 0 692 286 L 668 286 L 768 386 Z" fill="#cbd5e1" opacity="0.65" />

    <!-- Rimowa-style Vertical Ribs -->
    <rect x="348" y="346" width="20" height="428" rx="10" fill="#cbd5e1" opacity="0.75" />
    <rect x="444" y="346" width="20" height="428" rx="10" fill="#cbd5e1" opacity="0.75" />
    <rect x="560" y="346" width="20" height="428" rx="10" fill="#cbd5e1" opacity="0.75" />
    <rect x="656" y="346" width="20" height="428" rx="10" fill="#cbd5e1" opacity="0.75" />

    <!-- Horizontal Center Band -->
    <rect x="256" y="534" width="512" height="48" fill="#1e3a8a" opacity="0.12" />

    <!-- Luggage Tag hanging from top handle -->
    <path d="M 565 285 L 615 345" stroke="#d97706" stroke-width="10" stroke-linecap="round" />
    <g transform="translate(625, 338) rotate(18)">
      <rect x="-28" y="0" width="56" height="86" rx="12" fill="url(#tagGrad)" />
      <circle cx="0" cy="18" r="7" fill="#ffffff" />
      <rect x="-16" y="36" width="32" height="6" rx="3" fill="#fef3c7" />
      <rect x="-16" y="50" width="24" height="6" rx="3" fill="#fef3c7" />
    </g>
  </g>

  <!-- Emerald Green Checkmark Badge (Bottom Right Overlap) -->
  <g filter="url(#badgeShadow)">
    <circle cx="710" cy="740" r="142" fill="#ffffff" />
    <circle cx="710" cy="740" r="126" fill="url(#badgeGrad)" />
    <path d="M 648 742 L 692 786 L 778 696" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
